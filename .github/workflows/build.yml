name: Build Boards

on:
  # 手动触发：默认只编译 gezipai；填 all 编译全部变体
  workflow_dispatch:
    inputs:
      board:
        description: 'Board to build (default: gezipai, use "all" for full matrix)'
        required: false
        default: 'gezipai'
  push:
    branches:
      - main
      - ci/*       # for ci test
      - baseline/* # for 2.5.2 upgrade validation
      - v252-*     # for 2.5.2 upgrade (squashed baseline)
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  prepare:
    name: Determine variants to build
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    outputs:
      variants: ${{ steps.select.outputs.variants }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test build tooling
        run: python -m unittest discover -s scripts/tests -v

      - id: select
        name: Select variants based on changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          INPUT_BOARD: ${{ inputs.board }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          CHANGED_FILE="$RUNNER_TEMP/changed-files.txt"
          # 本仓库只维护 gezipai：除非手动触发并指定 all，否则只编译该板卡变体。
          # 过滤在 build.py 内完成（XIAOZHI_BOARD_FILTER），变更文件列表保持上游语义。
          BOARD_FILTER="${INPUT_BOARD:-gezipai}"
          if [[ "$BOARD_FILTER" == "all" ]]; then
            export XIAOZHI_BOARD_FILTER=""
          else
            export XIAOZHI_BOARD_FILTER="$BOARD_FILTER"
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            git ls-files > "$CHANGED_FILE"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            # Checkout is the synthetic merge commit. Compare the PR branch
            # from its merge base, excluding unrelated updates on main.
            git diff --name-only --no-renames HEAD^1...HEAD^2 > "$CHANGED_FILE"
          elif [[ "$BEFORE_SHA" =~ ^0+$ && "$GITHUB_REF" != "refs/heads/main" ]] && \
               BASE_SHA=$(git merge-base HEAD origin/main); then
            # First push of a ci/* branch has an all-zero before SHA.
            git diff --name-only --no-renames "$BASE_SHA" HEAD > "$CHANGED_FILE"
          elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]] && \
               git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --name-only --no-renames "$BEFORE_SHA" HEAD > "$CHANGED_FILE"
          else
            # A missing baseline (e.g. an unavailable force-pushed commit)
            # must not silently omit changed boards.
            git ls-files > "$CHANGED_FILE"
          fi

          cat "$CHANGED_FILE"

          # Keep the full manual matrix out of environment variables.
          python scripts/build.py --select-changed < "$CHANGED_FILE" > "$RUNNER_TEMP/variants.json"
          {
            printf 'variants='
            cat "$RUNNER_TEMP/variants.json"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.ci_name || matrix.full_name }}
    needs: prepare
    if: ${{ needs.prepare.outputs.variants != '[]' }}
    strategy:
      fail-fast: false  # 单个变体失败不影响其它变体
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.variants) }}
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build current variant
        shell: bash
        env:
          BOARD: ${{ matrix.board }}
          VARIANT: ${{ matrix.name }}
          BUILD_OPTIONS_JSON: ${{ toJSON(matrix.ci_build_options) }}
        run: |
          source "$IDF_PATH/export.sh"
          OPTIONS=()
          if [[ "$BUILD_OPTIONS_JSON" != "null" && -n "$BUILD_OPTIONS_JSON" ]]; then
            OPTIONS+=(--build-options-json "$BUILD_OPTIONS_JSON")
          fi
          python scripts/build.py "$BOARD" --name "$VARIANT" "${OPTIONS[@]}"

      - name: Rename firmware
        shell: bash
        run: |
          NAME="${{ matrix.ci_name || matrix.full_name }}"
          cp build/merged-binary.bin "xiaozhi_${NAME}_${GITHUB_SHA::7}.bin"
          ls -l "xiaozhi_${NAME}_${GITHUB_SHA::7}.bin"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.ci_name || matrix.full_name }}
          path: xiaozhi_*.bin
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.variants != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA7="${GITHUB_SHA::7}"
          TAG="v2.5.2-${SHA7}"
          echo "== downloaded =="
          ls -l dist
          NOTES="gezipai 2.5.2 build, commit ${GITHUB_SHA}, run #${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.bin --clobber
          else
            gh release create "$TAG" dist/*.bin --title "$TAG" --notes "$NOTES"
          fi
