name: Build Boards

on:
  push:
    branches:
      - main
      - ci/* # for ci test
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      board:
        description: '要编译的板子名（main/boards 下的目录名），留空则编译全部板卡'
        required: false
        default: 'gezipai'
        type: string

permissions:
  contents: write

jobs:
  prepare:
    name: Determine boards to build
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.select.outputs.boards }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - id: list
        name: Get all board list
        run: |
          echo "all_boards=$(python scripts/release.py --list-boards --json)" >> $GITHUB_OUTPUT

      - id: version
        name: Get project version
        run: echo "version=$(grep -m1 'set(PROJECT_VER' CMakeLists.txt | cut -d'\"' -f2)" >> $GITHUB_OUTPUT

      - id: select
        name: Select boards based on changes
        env:
          ALL_BOARDS: ${{ steps.list.outputs.all_boards }}
          # push 时只编译这块板，避免一次性全量编译 97 个变体
          DEFAULT_BOARD: gezipai
        run: |
          EVENT_NAME="${{ github.event_name }}"

          # 手动触发：只编译指定板子（留空则编译全部板卡）
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            BOARD="${{ github.event.inputs.board }}"
            if [[ -z "$BOARD" ]]; then
              echo "boards=$ALL_BOARDS" >> $GITHUB_OUTPUT
            else
              # 注意：本仓库 release.py --list-boards --json 输出的是字符串数组，不是对象数组
              FILTERED=$(echo "$ALL_BOARDS" | jq -c --arg board "$BOARD" 'map(select(. == $board))')
              echo "boards=$FILTERED" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi

          # push：只编译默认板（DEFAULT_BOARD），不再全量编译所有板
          if [[ "$EVENT_NAME" == "push" ]]; then
            FILTERED=$(echo "$ALL_BOARDS" | jq -c --arg board "$DEFAULT_BOARD" 'map(select(. == $board))')
            echo "boards=$FILTERED" >> $GITHUB_OUTPUT
            exit 0
          fi

          # For pull_request
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "Base: $BASE_SHA, Head: $HEAD_SHA"

          CHANGED=$(git diff --name-only $BASE_SHA $HEAD_SHA || true)
          echo "Changed files:\n$CHANGED"

          NEED_ALL=0
          declare -A AFFECTED
          while IFS= read -r file; do
            if [[ "$file" == main/* && "$file" != main/boards/* ]]; then
              NEED_ALL=1
            fi

            if [[ "$file" == main/boards/common/* ]]; then
              NEED_ALL=1
            fi

            if [[ "$file" == main/boards/* ]]; then
              board=$(echo "$file" | cut -d '/' -f3)
              AFFECTED[$board]=1
            fi
          done <<< "$CHANGED"

          if [[ "$NEED_ALL" -eq 1 ]]; then
            echo "boards=$ALL_BOARDS" >> $GITHUB_OUTPUT
          else
            if [[ ${#AFFECTED[@]} -eq 0 ]]; then
              echo "boards=[]" >> $GITHUB_OUTPUT
            else
              JSON=$(printf '%s\n' "${!AFFECTED[@]}" | sort -u | jq -R -s -c 'split("\n")[:-1]')
              echo "boards=$JSON" >> $GITHUB_OUTPUT
            fi
          fi

  build:
    name: Build ${{ matrix.board }}
    needs: prepare
    if: ${{ needs.prepare.outputs.boards != '[]' }}
    strategy:
      fail-fast: false  # 单个 board 失败不影响其它 board
      matrix:
        board: ${{ fromJson(needs.prepare.outputs.boards) }}
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare secret_config.h
        shell: bash
        run: |
          for f in main/boards/*/secret_config.h.example; do
            [ -e "$f" ] || continue
            h="${f%.example}"
            if [ ! -f "$h" ]; then
              cp "$f" "$h"
              echo "generated $h"
            fi
          done

      - name: Build current board
        shell: bash
        run: |
          source $IDF_PATH/export.sh
          python scripts/release.py ${{ matrix.board }}

      - name: Package firmware
        shell: bash
        run: cp build/merged-binary.bin xiaozhi_${{ matrix.board }}_${{ github.sha }}.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi_${{ matrix.board }}_${{ github.sha }}.bin
          path: xiaozhi_${{ matrix.board }}_${{ github.sha }}.bin
          if-no-files-found: error

  publish:
    name: Publish to GitHub Release
    needs: [prepare, build]
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.prepare.outputs.boards != '[]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set release tag
        id: tag
        run: echo "tag=v${{ needs.prepare.outputs.version }}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: dist/*.bin
          overwrite_files: true
          body: |
            自动构建产物（Build Boards）

            - Commit: `${{ github.sha }}`
            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - 烧录：merged-binary 从 0x0 地址烧录，`esptool.py write_flash 0x0 <bin>`
