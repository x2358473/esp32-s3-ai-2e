name: Build Boards

on:
  # 手动触发：默认只编译 gezipai；填 all 编译全部变体
  workflow_dispatch:
    inputs:
      board:
        description: 'Board to build (default: gezipai, use "all" for full matrix)'
        required: false
        default: 'gezipai'
  push:
    branches:
      - main
      - ci/*       # for ci test
      - baseline/* # for 2.5.2 upgrade validation
      - v252-*     # for 2.5.2 upgrade (squashed baseline)
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  prepare:
    name: Determine variants to build
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    outputs:
      variants: ${{ steps.select.outputs.variants }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test build tooling
        run: python -m unittest discover -s scripts/tests -v

      - id: select
        name: Select variants based on changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          INPUT_BOARD: ${{ inputs.board }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          CHANGED_FILE="$RUNNER_TEMP/changed-files.txt"
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_BOARD" == "all" ]]; then
            # 手动触发并显式要求全量时才编译所有变体
            git ls-files > "$CHANGED_FILE"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            # Checkout is the synthetic merge commit. Compare the PR branch
            # from its merge base, excluding unrelated updates on main.
            git diff --name-only --no-renames HEAD^1...HEAD^2 > "$CHANGED_FILE"
          else
            # 本仓库只维护 gezipai 一块板：push 与手动触发都只编译它，
            # 避免 Kconfig / CMakeLists 等公共文件变更触发代表性变体矩阵。
            BOARD_SEL="${INPUT_BOARD:-gezipai}"
            git ls-files "main/boards/$BOARD_SEL" > "$CHANGED_FILE"
          fi

          cat "$CHANGED_FILE"

          # Keep the full manual matrix out of environment variables.
          python scripts/build.py --select-changed < "$CHANGED_FILE" > "$RUNNER_TEMP/variants.json"
          {
            printf 'variants='
            cat "$RUNNER_TEMP/variants.json"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.ci_name || matrix.full_name }}
    needs: prepare
    if: ${{ needs.prepare.outputs.variants != '[]' }}
    strategy:
      fail-fast: false  # 单个变体失败不影响其它变体
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.variants) }}
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build current variant
        shell: bash
        env:
          BOARD: ${{ matrix.board }}
          VARIANT: ${{ matrix.name }}
          BUILD_OPTIONS_JSON: ${{ toJSON(matrix.ci_build_options) }}
        run: |
          source "$IDF_PATH/export.sh"
          OPTIONS=()
          if [[ "$BUILD_OPTIONS_JSON" != "null" && -n "$BUILD_OPTIONS_JSON" ]]; then
            OPTIONS+=(--build-options-json "$BUILD_OPTIONS_JSON")
          fi
          python scripts/build.py "$BOARD" --name "$VARIANT" "${OPTIONS[@]}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xiaozhi_${{ matrix.ci_name || matrix.full_name }}_${{ github.sha }}
          path: build/merged-binary.bin
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.variants != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA7="${GITHUB_SHA::7}"
          TAG="v2.5.2-${SHA7}"
          mkdir -p out
          for d in dist/*/; do
            name="$(basename "$d")"
            board="$(echo "$name" | sed -E 's/^xiaozhi_(.*)_[0-9a-f]{40}$/\1/')"
            src="$d/merged-binary.bin"
            [ -f "$src" ] || continue
            cp "$src" "out/xiaozhi_${board}_${SHA7}.bin"
          done
          ls -l out
          NOTES="gezipai 2.5.2 build, commit ${GITHUB_SHA}, run #${GITHUB_RUN_NUMBER}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/*.bin --clobber
          else
            gh release create "$TAG" out/*.bin --title "$TAG" --notes "$NOTES"
          fi
