name: Build Boards

on:
  # 全部改为手动触发：不再随 push / pull_request 自动构建
  workflow_dispatch:
    inputs:
      board:
        description: 'Board to build'
        type: choice
        required: true
        default: 'gezipai'
        options:
          - gezipai
          - luobo/esp32-s3-nano-rlcd
          - all

permissions:
  contents: read

jobs:
  prepare:
    name: Determine variants to build
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    outputs:
      variants: ${{ steps.select.outputs.variants }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test build tooling
        run: python -m unittest discover -s scripts/tests -v

      - id: select
        name: Select variants based on changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          INPUT_BOARD: ${{ inputs.board }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          CHANGED_FILE="$RUNNER_TEMP/changed-files.txt"
          # 本仓库只维护 gezipai：除非手动触发并指定 all，否则只编译该板卡变体。
          # 过滤在 build.py 内完成（XIAOZHI_BOARD_FILTER），变更文件列表保持上游语义。
          BOARD_FILTER="${INPUT_BOARD:-gezipai}"
          if [[ "$BOARD_FILTER" == "all" ]]; then
            export XIAOZHI_BOARD_FILTER=""
          else
            export XIAOZHI_BOARD_FILTER="$BOARD_FILTER"
          fi
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            git ls-files > "$CHANGED_FILE"
          elif [[ "$EVENT_NAME" == "pull_request" ]]; then
            # Checkout is the synthetic merge commit. Compare the PR branch
            # from its merge base, excluding unrelated updates on main.
            git diff --name-only --no-renames HEAD^1...HEAD^2 > "$CHANGED_FILE"
          elif [[ "$BEFORE_SHA" =~ ^0+$ && "$GITHUB_REF" != "refs/heads/main" ]] && \
               BASE_SHA=$(git merge-base HEAD origin/main); then
            # First push of a ci/* branch has an all-zero before SHA.
            git diff --name-only --no-renames "$BASE_SHA" HEAD > "$CHANGED_FILE"
          elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]] && \
               git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            git diff --name-only --no-renames "$BEFORE_SHA" HEAD > "$CHANGED_FILE"
          else
            # A missing baseline (e.g. an unavailable force-pushed commit)
            # must not silently omit changed boards.
            git ls-files > "$CHANGED_FILE"
          fi

          cat "$CHANGED_FILE"

          # Keep the full manual matrix out of environment variables.
          python scripts/build.py --select-changed < "$CHANGED_FILE" > "$RUNNER_TEMP/variants.json"
          {
            printf 'variants='
            cat "$RUNNER_TEMP/variants.json"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.ci_name || matrix.full_name }}
    needs: prepare
    if: ${{ needs.prepare.outputs.variants != '[]' }}
    strategy:
      fail-fast: false  # 单个变体失败不影响其它变体
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.variants) }}
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build current variant
        shell: bash
        env:
          BOARD: ${{ matrix.board }}
          VARIANT: ${{ matrix.name }}
          BUILD_OPTIONS_JSON: ${{ toJSON(matrix.ci_build_options) }}
        run: |
          source "$IDF_PATH/export.sh"
          OPTIONS=()
          if [[ "$BUILD_OPTIONS_JSON" != "null" && -n "$BUILD_OPTIONS_JSON" ]]; then
            OPTIONS+=(--build-options-json "$BUILD_OPTIONS_JSON")
          fi
          python scripts/build.py "$BOARD" --name "$VARIANT" "${OPTIONS[@]}"

      # 诊断用：把 esp_codec_dev 的 I2C 适配层与配置结构体打印到日志，
      # 便于确认各版本里时钟字段的真实名字（clock_speed / scl_speed_hz / 不存在）。
      - name: Dump esp_codec_dev i2c config
        if: always()
        shell: bash
        run: |
          echo "===== audio_codec_ctrl_i2c.c ====="
          find . -name "audio_codec_ctrl_i2c.c" -not -path "./build/*" 2>/dev/null | while read -r f; do
            echo "--- $f"
            grep -n "scl_speed_hz\|clock_speed\|i2c_device_config_t" "$f" || true
            echo "--- full file (first 160 lines) ---"
            sed -n '1,160p' "$f" || true
          done
          echo "===== audio_codec_new_i2c_ctrl ====="
          grep -rn -A25 "audio_codec_new_i2c_ctrl(audio_codec_i2c_cfg_t" --include=*.c . 2>/dev/null | head -70 || true
          echo "===== DEFAULT_I2C_CLOCK ====="
          grep -rn "DEFAULT_I2C_CLOCK" --include=*.c --include=*.h . 2>/dev/null | head -20 || true
          echo "===== audio_codec_i2c_cfg_t ====="
          find . -name "*.h" -not -path "./build/*" 2>/dev/null | while read -r h; do
            if grep -q "audio_codec_i2c_cfg_t;" "$h" 2>/dev/null; then
              echo "--- $h"
              grep -n -B10 "audio_codec_i2c_cfg_t;" "$h" || true
            fi
          done

      - name: Rename firmware
        shell: bash
        run: |
          set -euo pipefail
          source "${IDF_PATH}/export.sh" >/dev/null 2>&1 || true
          NAME="${{ matrix.ci_name || matrix.full_name }}"
          SHA7="${GITHUB_SHA::7}"
          cp build/merged-binary.bin "xiaozhi_${NAME}_${SHA7}.bin"

          # assets 分区单独烧录，缺少会导致模型加载后 AFE 初始化崩溃
          if [ -f build/generated_assets.bin ]; then
            cp build/generated_assets.bin "xiaozhi_${NAME}_${SHA7}_assets.bin"
            # merged-binary 已延伸到 0x800000 之后，无法再用 merge-bin（会报 overlap），
            # 这里按偏移覆盖生成单文件完整镜像，供网页刷机使用。
            python scripts/make_full_image.py \
              build/merged-binary.bin \
              build/generated_assets.bin \
              "xiaozhi_${NAME}_${SHA7}_full.bin"
          else
            echo "::warning::build/generated_assets.bin not found, assets partition will not be included"
          fi
          ls -l xiaozhi_*.bin

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.ci_name || matrix.full_name }}
          path: |
            xiaozhi_*.bin
            build/xiaozhi.elf
            build/xiaozhi.map
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [prepare, build]
    if: ${{ needs.prepare.outputs.variants != '[]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Set release tag
        id: tag
        run: echo "tag=v2.5.2-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: dist/*.bin
          overwrite_files: true
          body: |
            自动构建产物（xiaozhi 2.5.2 基线 / ${{ inputs.board }}）

            - Commit: `${{ github.sha }}`
            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            包含三个文件（`<board>` 为板卡名，斜杠替换为横线）：

            - `xiaozhi_<board>_<sha>_full.bin` —— **完整镜像**（0x0 起，已含 assets 分区），ESP Web Tools / 网页刷机用这个
            - `xiaozhi_<board>_<sha>.bin` —— 仅 app（bootloader + 分区表 + 应用）
            - `xiaozhi_<board>_<sha>_assets.bin` —— assets 分区（0x800000），与 app 配套

            命令行烧录（app + assets 分开写）：

            ```
            esptool.py --chip esp32s3 -p <COM> -b 460800 write_flash \
              0x0       xiaozhi_<board>_<sha>.bin \
              0x800000  xiaozhi_<board>_<sha>_assets.bin
            ```

            Web 工具烧录：直接选 `_full.bin`（大小约 8.6MB，写入会慢一些）。

            从旧版本升级建议先 `esptool.py erase_flash`，否则 assets 分区残留会与新固件不匹配。
